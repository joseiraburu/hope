# Compila HOPE automáticamente en cada cambio:
#   - análisis y pruebas (y validación de los archivos que se exportan)
#   - APK de Android
#   - instalador y versión portable de Windows
#   - prueba del vídeo MP4 en Windows y en un emulador de Android
# Para publicar una versión descargable en «Releases»: pestaña Actions →
# «Compilar HOPE» → «Run workflow» → marcar «Publicar versión». También se
# publica al subir una etiqueta "v0.1.0", "v0.2.0"...
name: Compilar HOPE

on:
  push:
    branches-ignore: [ci-capturas]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar versión descargable en Releases'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versión de Flutter
        run: echo "::notice title=Flutter::$(flutter --version | head -n 1)"
      - run: flutter pub get
      - name: Análisis
        run: |
          set -o pipefail
          status=0
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || status=$?
          cat analyze.log
          python3 tool/anotar.py analyze.log
          exit $status
      - name: Pruebas
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log
      - name: Validar los archivos generados
        run: |
          python3 -m venv /tmp/val
          /tmp/val/bin/pip install --quiet pillow openpyxl pypdf
          /tmp/val/bin/python tool/validar_muestras.py build/muestras
      - name: Mostrar las pruebas fallidas
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          echo "::error title=Pruebas::$( (grep -B 60 -A 6 '\[E\]' test.log || tail -n 80 test.log) | head -n 160 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Publicar capturas para revisión
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d build/capturas ] && [ ! -d build/muestras ]; then exit 0; fi
          rm -rf /tmp/capturas && mkdir -p /tmp/capturas
          cp -r build/capturas /tmp/capturas/ 2>/dev/null || true
          cp -r build/muestras /tmp/capturas/ 2>/dev/null || true
          cd /tmp/capturas
          git init -q -b ci-capturas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-capturas

  android:
    name: Android (APK)
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versión
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Clave de firma estable
        # Si existe el secreto ANDROID_KEYSTORE_BASE64, todas las versiones se
        # firman con la misma clave y se pueden actualizar sin desinstalar.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Usando la clave de firma del proyecto."
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: el APK se firma con una clave temporal."
          fi
      - run: bash tool/preparar_plataformas.sh
      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Mostrar el error de compilación
        if: failure()
        run: |
          detalle=$( (grep -E -A 4 '^e: |error:|What went wrong' build.log | head -n 80; echo ----; tail -n 40 build.log) 2>/dev/null)
          echo "::error title=Android::$(printf '%s\n' "$detalle" | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/HOPE-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HOPE-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows (instalador)
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versión
        shell: bash
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Preparar plataformas
        shell: bash
        run: bash tool/preparar_plataformas.sh
      - name: Compilar Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Mostrar el error de compilación
        if: failure()
        shell: bash
        run: |
          detalle=$( (grep -E 'error|warning C' build.log | head -n 60; echo ----; tail -n 30 build.log) 2>/dev/null)
          echo "::error title=Windows::$(printf '%s\n' "$detalle" | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Incluir las bibliotecas de Visual C++
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "$env:WINDIR\System32\$dll" $dest
          }
      - name: Crear el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\hope.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Versión portable (.zip)
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\HOPE-$env:VERSION-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HOPE-windows
          path: dist/*
          if-no-files-found: error
      - name: Probar el vídeo MP4 (Media Foundation)
        timeout-minutes: 30
        shell: bash
        run: bash tool/prueba_video.sh windows "$(pwd -W)/build/muestras_video"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar los vídeos con FFmpeg
        shell: bash
        run: |
          python -m pip install --quiet av pillow
          python tool/validar_muestras.py build/muestras_video --videos

  video-android:
    name: Android (vídeo en el emulador)
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Activar la aceleración del emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash tool/preparar_plataformas.sh
      - name: Compilar la prueba
        run: |
          set -o pipefail
          flutter build apk --debug --target=integration_test/video_test.dart 2>&1 | tee build.log
      - name: Mostrar el error de compilación
        if: failure()
        run: |
          detalle=$( (grep -E -A 4 '^e: |error:|What went wrong' build.log | head -n 80; echo ----; tail -n 40 build.log) 2>/dev/null)
          echo "::error title=Android (prueba)::$(printf '%s\n' "$detalle" | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Emulador y prueba del vídeo
        # Cada intento de la prueba tiene su propio límite (tool/prueba_video.sh);
        # este es el máximo para todo el paso, arranque del emulador incluido.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/prueba_video.sh emulator-5554

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # La versión ya existe: se sustituyen sus archivos por los nuevos.
            echo "La versión $TAG ya existe: se actualizan sus archivos."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "HOPE ${TAG#v}" \
              --notes-file docs/notas-version.md \
              --prerelease
          fi
