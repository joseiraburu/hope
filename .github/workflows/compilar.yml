# Compila HOPE automáticamente en cada cambio:
#   - análisis y pruebas
#   - APK de Android
#   - instalador y versión portable de Windows
# Al crear una etiqueta "v0.1.0", "v0.2.0"..., publica una versión descargable
# en la pestaña «Releases» del repositorio.
name: Compilar HOPE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log
      - name: Mostrar las pruebas fallidas
        if: failure()
        run: |
          echo "::error title=Pruebas::$( (grep -B 60 -A 6 '\[E\]' test.log || tail -n 80 test.log) | head -n 160 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  android:
    name: Android (APK)
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versión
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Clave de firma estable
        # Si existe el secreto ANDROID_KEYSTORE_BASE64, todas las versiones se
        # firman con la misma clave y se pueden actualizar sin desinstalar.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Usando la clave de firma del proyecto."
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: el APK se firma con una clave temporal."
          fi
      - run: bash tool/preparar_plataformas.sh
      - name: Compilar APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Mostrar el error de compilación
        if: failure()
        run: |
          echo "::error title=Android::$(tail -n 80 build.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/HOPE-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: HOPE-android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows (instalador)
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Versión
        shell: bash
        run: |
          echo "VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_ENV"
      - name: Preparar plataformas
        shell: bash
        run: bash tool/preparar_plataformas.sh
      - name: Compilar Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Mostrar el error de compilación
        if: failure()
        shell: bash
        run: |
          echo "::error title=Windows::$(tail -n 80 build.log 2>/dev/null | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Incluir las bibliotecas de Visual C++
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            Copy-Item "$env:WINDIR\System32\$dll" $dest
          }
      - name: Crear el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\hope.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Versión portable (.zip)
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\HOPE-$env:VERSION-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HOPE-windows
          path: dist/*
          if-no-files-found: error

  publicar:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear la versión en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "HOPE ${GITHUB_REF_NAME#v}" \
            --notes-file docs/notas-version.md \
            --prerelease
